name: local-platform

# Local GitOps, structured operation baseline, regression. Runner의 disposable k3d만 사용한다.
on:
  pull_request:
    paths:
      - .github/workflows/local-platform.yml
      - Makefile
      - .gitignore
      - versions.env
      - infra/terraform/**
      - platform/argocd/**
      - platform/forgejo/**
      - platform/local/**
      - scripts/**
      - tests/e2e/**
      - cmd/ext-authz-sim/**
      - experiments/fixtures/shared-gate/**
      - docs/local-operations.md

permissions:
  contents: read
  checks: read

concurrency:
  group: local-platform-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  local-platform:
    name: static + fresh local lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # pull_request.paths는 PR 전체 3-dot diff를 보므로, 같은 PR의 docs-only 후속 push도 workflow 자체는 다시 실행된다.
      # synchronize의 직전 HEAD → 현재 HEAD delta와 직전 local-platform 성공을 둘 다 증명한 경우에만 expensive runtime을 생략한다.
      # 비교/API 조회가 불확실하면 runtime_changed=true를 유지해 기존 전체 검증으로 fail safe한다.
      - name: Classify current PR update
        id: changes
        env:
          EVENT_ACTION: ${{ github.event.action }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          runtime_changed=true
          reason="full runtime by default"

          if [[ "$EVENT_ACTION" == "synchronize" &&
                "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ &&
                "$AFTER_SHA" =~ ^[0-9a-f]{40}$ &&
                "$AFTER_SHA" == "$(git rev-parse HEAD)" ]]; then
            if ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              if ! git fetch --no-tags --depth=1 origin "$BEFORE_SHA" >/dev/null 2>&1; then
                reason="previous head cannot be fetched"
              fi
            fi

            if git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              changed_file="$(mktemp)"
              if git diff --name-only --no-renames "$BEFORE_SHA" "$AFTER_SHA" >"$changed_file"; then
                mapfile -t changed <"$changed_file"
                docs_only=true
                ((${#changed[@]} > 0)) || docs_only=false
                for path in "${changed[@]}"; do
                  printf 'delta path: %s\n' "$path"
                  case "$path" in
                    docs/local-operations.md) ;;
                    *) docs_only=false; break ;;
                  esac
                done

                if [[ "$docs_only" == true ]]; then
                  checks_file="$(mktemp)"
                  api="https://api.github.com/repos/$REPOSITORY/commits/$BEFORE_SHA/check-runs?filter=latest&per_page=100"
                  if curl -fsSL --retry 2 \
                    -H "Authorization: Bearer $GH_TOKEN" \
                    -H "Accept: application/vnd.github+json" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    "$api" >"$checks_file" &&
                    jq -e 'any(.check_runs[]?;
                      .name == "static + fresh local lifecycle" and
                      .status == "completed" and .conclusion == "success")' "$checks_file" >/dev/null; then
                    runtime_changed=false
                    reason="docs-only synchronize after successful previous local-platform head"
                  else
                    reason="docs-only delta but previous successful local-platform head is not proven"
                  fi
                  rm -f "$checks_file"
                else
                  reason="current push changes runtime-impacting paths"
                fi
              else
                reason="cannot diff previous and current heads"
              fi
              rm -f "$changed_file"
            fi
          elif [[ "$EVENT_ACTION" == "synchronize" ]]; then
            reason="synchronize payload/head validation failed"
          else
            reason="opened/reopened PR requires full runtime"
          fi

          echo "runtime_changed=$runtime_changed" >>"$GITHUB_OUTPUT"
          echo "runtime_changed=$runtime_changed: $reason"

      - name: Install pinned tools
        run: make tools

      - name: Source / static / render validation
        run: make static

      - name: Fresh lifecycle (make local) + owned cleanup
        if: steps.changes.outputs.runtime_changed == 'true'
        run: |
          make local
          if .tmp/bin/k3d cluster get capacity-cascade-local >/dev/null 2>&1; then
            echo "invocation-owned cluster left after make local" >&2
            exit 1
          fi
          for f in .tmp/kubeconfig .tmp/journey .tmp/rendered .tmp/port-forward.log; do
            [[ ! -e "$f" ]] || { echo "runtime output left after make local: $f" >&2; exit 1; }
          done
          summary="$(find results/local -name baseline-summary.json -print -quit)"
          [[ -n "$summary" ]] || { echo "baseline summary missing after owned cleanup" >&2; exit 1; }
          jq -e --arg sha "$(git rev-parse HEAD)" '.source_sha == $sha and .operation_samples == 45 and .attempt_samples == 45' "$summary" >/dev/null
          echo "UPGRADE_BASELINE_RESULT=$summary" >>"$GITHUB_ENV"

      - name: Retain sanitized operation results
        if: ${{ always() && steps.changes.outputs.runtime_changed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: local-operation-results
          path: |
            results/local/*/*/events.jsonl
            results/local/shared-gate-*/gated/*/events.jsonl
            results/local/shared-gate-*/post-removal/*/events.jsonl
            results/local/**/baseline-summary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify same-cluster healthy gate and removal evidence
        if: steps.changes.outputs.runtime_changed == 'true'
        run: |
          result="$(find results/local -maxdepth 2 -path '*/shared-gate-*/result.json' -print -quit)"
          [[ -n "$result" ]] || { echo "shared gate result missing" >&2; exit 1; }
          python3 scripts/validate-shared-gate.py result "$(dirname "$result")"
          jq -e --arg sha "$(git rev-parse HEAD)" '.source_sha == $sha and .source_dirty == false and .completed == true' "$result" >/dev/null

      - name: Verify frozen saturation and bounded retry evidence
        if: steps.changes.outputs.runtime_changed == 'true'
        run: |
          result="$(find results/local -path '*/shared-gate-*/saturation/result.json' -print -quit)"
          [[ -n "$result" ]] || { echo "saturation result missing" >&2; exit 1; }
          python3 scripts/shared-gate-saturation.py result "$(dirname "$(dirname "$result")")"
          jq -e --arg sha "$(git rev-parse HEAD)" '.source_sha == $sha and .source_dirty == false and .completed == true' "$result" >/dev/null

      - name: Retain sanitized shared gate evidence
        if: ${{ always() && steps.changes.outputs.runtime_changed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: local-shared-gate-results
          path: |
            results/local/shared-gate-*/source.json
            results/local/shared-gate-*/direct-baseline.json
            results/local/shared-gate-*/app-image.json
            results/local/shared-gate-*/istio-source.yaml
            results/local/shared-gate-*/fixture-source.yaml
            results/local/shared-gate-*/owned-resources.json
            results/local/shared-gate-*/runtime.json
            results/local/shared-gate-*/deny.json
            results/local/shared-gate-*/checks.jsonl
            results/local/shared-gate-*/path.json
            results/local/shared-gate-*/removal.json
            results/local/shared-gate-*/phases.jsonl
            results/local/shared-gate-*/result.json
            results/local/shared-gate-*/saturation/calibration-plan.json
            results/local/shared-gate-*/saturation/frozen.json
            results/local/shared-gate-*/saturation/result.json
            results/local/shared-gate-*/saturation/calibration/events.jsonl
            results/local/shared-gate-*/saturation/calibration/configuration.json
            results/local/shared-gate-*/saturation/calibration/before.json
            results/local/shared-gate-*/saturation/calibration/after.json
            results/local/shared-gate-*/saturation/calibration/path.json
            results/local/shared-gate-*/saturation/calibration/summary.json
            results/local/shared-gate-*/saturation/no-retry/events.jsonl
            results/local/shared-gate-*/saturation/no-retry/configuration.json
            results/local/shared-gate-*/saturation/no-retry/before.json
            results/local/shared-gate-*/saturation/no-retry/after.json
            results/local/shared-gate-*/saturation/no-retry/path.json
            results/local/shared-gate-*/saturation/no-retry/summary.json
            results/local/shared-gate-*/saturation/retry/events.jsonl
            results/local/shared-gate-*/saturation/retry/configuration.json
            results/local/shared-gate-*/saturation/retry/before.json
            results/local/shared-gate-*/saturation/retry/after.json
            results/local/shared-gate-*/saturation/retry/path.json
            results/local/shared-gate-*/saturation/retry/summary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Fresh coordinated backup and restore
        if: steps.changes.outputs.runtime_changed == 'true'
        run: |
          make recovery
          if .tmp/bin/k3d cluster get capacity-cascade-local >/dev/null 2>&1; then
            echo "recovery-owned cluster left after make recovery" >&2
            exit 1
          fi
          result="$(find results/local -path '*/recovery-*/result.json' -print -quit)"
          [[ -n "$result" ]] || { echo "recovery result missing" >&2; exit 1; }
          jq -e --arg sha "$(git rev-parse HEAD)" '.source_sha == $sha and .source_dirty == false and .completed == true' "$result" >/dev/null
          echo "UPGRADE_RECOVERY_RESULT=$result" >>"$GITHUB_ENV"

      - name: Retain sanitized recovery evidence
        if: ${{ always() && steps.changes.outputs.runtime_changed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: local-recovery-results
          path: |
            results/local/recovery-*/checkpoint.json
            results/local/recovery-*/doctor-source.json
            results/local/recovery-*/doctor-target.json
            results/local/recovery-*/phases.jsonl
            results/local/recovery-*/result.json
            results/local/recovery-*/target-identity.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Forgejo patch upgrade and fresh state-aware rollback
        if: steps.changes.outputs.runtime_changed == 'true'
        run: |
          make upgrade
          result="$(find results/local -path '*/upgrade-*/result.json' -print -quit)"
          [[ -n "$result" ]] || { echo "upgrade result missing" >&2; exit 1; }
          python3 scripts/validate-upgrade.py result "$result"
          jq -e --arg sha "$(git rev-parse HEAD)" '.source_sha == $sha and .source_dirty == false and .completed == true' "$result" >/dev/null

      - name: Retain sanitized upgrade evidence
        if: ${{ always() && steps.changes.outputs.runtime_changed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: local-upgrade-results
          path: |
            results/local/upgrade-*/checkpoint.json
            results/local/upgrade-*/doctor-source.json
            results/local/upgrade-*/doctor-upgraded.json
            results/local/upgrade-*/doctor-target.json
            results/local/upgrade-*/doctor-post-write.json
            results/local/upgrade-*/phases.jsonl
            results/local/upgrade-*/upstream.jsonl
            results/local/upgrade-*/runtime-a.json
            results/local/upgrade-*/runtime-b.json
            results/local/upgrade-*/runtime-rollback.json
            results/local/upgrade-*/b-marker.json
            results/local/upgrade-*/marker-absence.json
            results/local/upgrade-*/post-write.json
            results/local/upgrade-*/target-identity.json
            results/local/upgrade-*/result.json
            results/local/upgrade-*/regression-baseline.json
            results/local/upgrade-*/regression-recovery.json
          if-no-files-found: ignore
          retention-days: 14

      # 아래 guard는 다른 invocation이 소유한 cluster를 만든 뒤, ownership을 얻지 못했거나 증명하지 못한 invocation이
      # 실패하면서 그 cluster(server container ID)와 runtime output을 삭제/변경하지 않는지 확인한다.
      - name: Guard cluster owned by another invocation
        if: steps.changes.outputs.runtime_changed == 'true'
        id: up
        run: |
          make up
          echo "GUARD_SERVER_ID=$(docker ps -aq --no-trunc --filter label=k3d.cluster=capacity-cascade-local --filter label=k3d.role=server)" >>"$GITHUB_ENV"

      - name: Ownership guard (existing / concurrent create-delete / replaced / ambiguous / uninspectable cluster)
        if: steps.changes.outputs.runtime_changed == 'true'
        run: |
          mkdir -p .tmp/journey
          touch .tmp/journey/credentials.env .tmp/port-forward.log
          expect_refused() { # MESSAGE COMMAND...
            local out f
            if out="$("${@:2}" 2>&1)"; then
              printf '%s\n' "$out"
              echo "unexpected success: ${*:2}" >&2
              exit 1
            fi
            printf '%s\n' "$out"
            grep -qF "$1" <<<"$out" || { echo "expected refusal: $1" >&2; exit 1; }
            [[ "$(docker ps -aq --no-trunc --filter label=k3d.cluster=capacity-cascade-local --filter label=k3d.role=server)" == "$GUARD_SERVER_ID" ]] ||
              { echo "guard cluster was deleted or replaced" >&2; exit 1; }
            for f in .tmp/kubeconfig .tmp/journey/credentials.env .tmp/port-forward.log; do
              [[ -e "$f" ]] || { echo "guard runtime output was removed: $f" >&2; exit 1; }
            done
          }
          # 1. 이미 존재하는 cluster
          expect_refused "already exists" make local
          # 2. 다른 invocation이 lock 안에서 부재 확인 → create(또는 delete) 중인 TOCTOU window를 lock 보유로 재현
          exec 9>"${TMPDIR:-/tmp}/k3d-capacity-cascade-local.lock"
          flock -n 9
          expect_refused "create/delete is in progress" scripts/local-run.sh
          exec 9>&-
          # 3. 이 invocation이 만든 뒤 다른 invocation이 다시 만든 cluster (ownership marker의 server ID 불일치)
          marker="$(mktemp)"
          echo "not-$GUARD_SERVER_ID" >"$marker"
          expect_refused "was not created by this invocation" env LOCAL_CLUSTER_OWNERSHIP_MARKER="$marker" scripts/local-down.sh
          # 4-5. Ownership을 증명할 수 없는 모호한 상태. Marker에는 실제 server ID를 넣어, guard가 없으면 삭제가 일어나게 한다.
          #      Scripts가 PATH 앞에 두는 .tmp/bin에 docker wrapper를 두어 docker ps만 바꾸고(k3d는 Docker API 직접 사용) 나머지는 위임한다.
          echo "$GUARD_SERVER_ID" >"$marker"
          trap 'rm -f .tmp/bin/docker' EXIT
          cat >.tmp/bin/docker <<'EOF'
          #!/usr/bin/env bash
          case "${DOCKER_WRAPPER_MODE:-}:${1:-}" in
            inspect-failure:ps) echo "simulated docker ps failure" >&2; exit 1 ;;
            empty-server-id:ps) if [[ "$*" == *label=k3d.role=server* ]]; then exit 0; fi ;;
          esac
          exec "$REAL_DOCKER" "$@"
          EOF
          chmod +x .tmp/bin/docker
          # 4. Docker ownership inspection 실패
          expect_refused "cannot inspect cluster ownership" env REAL_DOCKER="$(command -v docker)" DOCKER_WRAPPER_MODE=inspect-failure \
            LOCAL_CLUSTER_OWNERSHIP_MARKER="$marker" scripts/local-down.sh
          # 5. k3d에는 cluster가 존재하지만 server identity 조회 결과가 비어 있음
          expect_refused "server identity is unavailable" env REAL_DOCKER="$(command -v docker)" DOCKER_WRAPPER_MODE=empty-server-id \
            LOCAL_CLUSTER_OWNERSHIP_MARKER="$marker" scripts/local-down.sh
          rm -f "$marker" .tmp/bin/docker
          # 6. Create preflight의 cluster 조회 실패. k3d cluster get/create는 runtime 조회 실패를 부재로 보고 create가 실패하면
          #    같은 이름 cluster를 rollback 삭제하므로, 부재가 증명되지 않으면 k3d cluster create를 호출하지 않아야 한다.
          #    도달 불가능한 DOCKER_HOST로 k3d의 실제 조회 실패를 만들고, k3d wrapper는 cluster create 호출만 기록·차단한다.
          mv .tmp/bin/k3d .tmp/bin/k3d.real
          trap 'mv .tmp/bin/k3d.real .tmp/bin/k3d' EXIT
          cat >.tmp/bin/k3d <<'EOF'
          #!/usr/bin/env bash
          if [[ "${1:-} ${2:-}" == "cluster create" ]]; then touch "$0.create-invoked"; echo "blocked k3d cluster create" >&2; exit 1; fi
          exec "$0.real" "$@"
          EOF
          chmod +x .tmp/bin/k3d
          expect_refused "cannot inspect k3d clusters; not creating" env DOCKER_HOST=unix:///nonexistent/docker.sock scripts/local-run.sh
          [[ ! -e .tmp/bin/k3d.create-invoked ]] || { echo "k3d cluster create ran without proven cluster absence" >&2; exit 1; }

      - name: Cleanup error path (k3d cluster delete failure)
        if: steps.changes.outputs.runtime_changed == 'true'
        run: |
          # 삭제 실패를 흉내 내는 k3d wrapper로 make down을 실행한다. 실패가 exit code로 드러나고,
          # cluster가 남아 있어도 kubeconfig/credential/temp output은 제거되어야 한다.
          mkdir -p .tmp/journey
          touch .tmp/journey/credentials.env .tmp/port-forward.log
          mv .tmp/bin/k3d .tmp/bin/k3d.real
          trap 'mv .tmp/bin/k3d.real .tmp/bin/k3d' EXIT
          cat >.tmp/bin/k3d <<'EOF'
          #!/usr/bin/env bash
          if [[ "${1:-} ${2:-}" == "cluster delete" ]]; then echo "simulated k3d cluster delete failure" >&2; exit 1; fi
          exec "$0.real" "$@"
          EOF
          chmod +x .tmp/bin/k3d
          if make down; then
            echo "make down hid the cluster delete failure" >&2
            exit 1
          fi
          for f in .tmp/kubeconfig .tmp/journey .tmp/rendered .tmp/port-forward.log; do
            [[ ! -e "$f" ]] || { echo "runtime output left after failed delete: $f" >&2; exit 1; }
          done
          # 삭제가 실제로 실패해 cluster가 남아 있어야 이 경로를 검증한 것이다.
          .tmp/bin/k3d.real cluster get capacity-cascade-local >/dev/null

      - name: Diagnostics
        if: ${{ failure() && steps.changes.outputs.runtime_changed == 'true' && steps.up.outcome == 'failure' }}
        run: scripts/local-verify.sh diagnostics

      - name: Cleanup
        if: ${{ always() && steps.changes.outputs.runtime_changed == 'true' }}
        run: make down
