{
  "apiVersion": "secrets-store.csi.x-k8s.io/v1",
  "kind": "SecretProviderClass",
  "metadata": {
    "name": "forgejo-secrets",
    "namespace": "forgejo",
    "annotations": {
      "argocd.argoproj.io/sync-wave": "-20"
    }
  },
  "spec": {
    "provider": "azure",
    "parameters": {
      "usePodIdentity": "false",
      "clientID": "{{ .Values.forgejo_secrets_client_id }}",
      "keyvaultName": "{{ .Values.key_vault_name }}",
      "tenantId": "{{ .Values.tenant_id }}",
      "objects": "array:\n  - |\n    objectName: forgejo-admin-username\n    objectType: secret\n  - |\n    objectName: forgejo-admin-password\n    objectType: secret\n  - |\n    objectName: forgejo-db-password\n    objectType: secret\n"
    },
    "secretObjects": [
      {
        "secretName": "forgejo-admin",
        "type": "Opaque",
        "data": [
          {
            "objectName": "forgejo-admin-username",
            "key": "username"
          },
          {
            "objectName": "forgejo-admin-password",
            "key": "password"
          }
        ]
      },
      {
        "secretName": "forgejo-db",
        "type": "Opaque",
        "data": [
          {
            "objectName": "forgejo-db-password",
            "key": "password"
          }
        ]
      }
    ]
  }
}
