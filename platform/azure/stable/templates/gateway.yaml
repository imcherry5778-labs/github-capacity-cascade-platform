{
  "apiVersion": "networking.istio.io/v1beta1",
  "kind": "Gateway",
  "metadata": {
    "name": "forgejo",
    "namespace": "forgejo",
    "annotations": {
      "argocd.argoproj.io/sync-wave": "0"
    }
  },
  "spec": {
    "selector": {
      "istio": "aks-istio-ingressgateway-external"
    },
    "servers": [
      {
        "port": {
          "number": 443,
          "name": "https",
          "protocol": "HTTPS"
        },
        "tls": {
          "mode": "SIMPLE",
          "credentialName": "forgejo-tls"
        },
        "hosts": [
          "{{ .Values.hostname }}"
        ]
      }
    ]
  }
}
