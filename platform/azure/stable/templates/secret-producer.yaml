{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "forgejo-secrets",
    "namespace": "forgejo",
    "annotations": {
      "argocd.argoproj.io/sync-wave": "-10"
    }
  },
  "spec": {
    "replicas": 1,
    "strategy": {
      "type": "Recreate"
    },
    "selector": {
      "matchLabels": {
        "app": "forgejo-secrets"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "forgejo-secrets",
          "azure.workload.identity/use": "true"
        },
        "annotations": {
          "sidecar.istio.io/inject": "false"
        }
      },
      "spec": {
        "serviceAccountName": "forgejo-secrets",
        "automountServiceAccountToken": false,
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 1000,
          "runAsGroup": 1000,
          "fsGroup": 1000
        },
        "containers": [
          {
            "name": "mount",
            "image": "{{ .Values.producer_image }}",
            "command": [
              "/bin/sh",
              "-c",
              "while true; do sleep 3600; done"
            ],
            "resources": {
              "requests": {
                "cpu": "10m",
                "memory": "32Mi"
              },
              "limits": {
                "cpu": "100m",
                "memory": "64Mi"
              }
            },
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "volumeMounts": [
              {
                "name": "secrets",
                "mountPath": "/mnt/secrets-store",
                "readOnly": true
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "secrets",
            "csi": {
              "driver": "secrets-store.csi.k8s.io",
              "readOnly": true,
              "volumeAttributes": {
                "secretProviderClass": "forgejo-secrets"
              }
            }
          }
        ]
      }
    }
  }
}
