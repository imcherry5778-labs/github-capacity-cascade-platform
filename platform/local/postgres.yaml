# Local-only PostgreSQL substitute. Forgejo Helm release 밖의 별도 namespace/lifecycle을 가진다.
# Credential은 scripts/local-up.sh가 runtime Secret `postgres-credentials`로 생성한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
  namespace: postgres
data:
  # 최초 initdb 때만 실행된다. Forgejo는 superuser가 아닌 전용 role/database를 사용한다.
  10-forgejo.sh: |
    psql -v ON_ERROR_STOP=1 -v forgejo_password="$FORGEJO_DB_PASSWORD" \
      --username "$POSTGRES_USER" --dbname postgres <<'SQL'
    CREATE ROLE forgejo LOGIN PASSWORD :'forgejo_password';
    CREATE DATABASE forgejo OWNER forgejo ENCODING 'UTF8' TEMPLATE template0;
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:17.11-alpine3.24
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: superuser-password
            - name: FORGEJO_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: forgejo-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            # initdb 중 임시 server는 TCP를 listen하지 않으므로 초기화 완료 후에만 Ready가 된다.
            exec:
              command: [pg_isready, --host=127.0.0.1, --username=forgejo, --dbname=forgejo]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: initdb
          configMap:
            name: postgres-initdb
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
